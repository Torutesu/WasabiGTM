# Free deployment: the whole stack on one machine, published through a
# Cloudflare Tunnel. Nothing here costs money except the machine itself.
#
#   cd app
#   cp .env.example .env            # fill in AUTH_SECRET, CRON_SECRET, keys
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   docker compose -f deploy/docker-compose.yml --env-file .env run --rm migrate
#
# See docs/deploy.md for the tunnel and the scheduler.

name: wasabi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wasabi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wasabi}
      POSTGRES_DB: wasabi
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasabi"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wasabi:${POSTGRES_PASSWORD:-wasabi}@db:5432/wasabi?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      WASABI_LLM_PROVIDER: ${WASABI_LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    ports:
      # Bound to loopback: the tunnel is the only way in from outside.
      - "127.0.0.1:3000:3000"

  # One-off: `docker compose … run --rm migrate`. Uses the build stage because
  # that is where the Prisma CLI and tsx live.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: build
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wasabi:${POSTGRES_PASSWORD:-wasabi}@db:5432/wasabi?schema=public
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-founder@wasabi.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?set SEED_USER_PASSWORD in .env}
      SEED_USER_NAME: ${SEED_USER_NAME:-Founder}
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  # The public hostname. Create the tunnel once (see docs/deploy.md), point its
  # ingress at http://app:3000, and put its token in .env. No inbound port has
  # to be opened on the firewall.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}

  # The heartbeat that makes the product autonomous. Cheaper than a cron daemon
  # in the image and visible in `docker compose logs`.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-900}
    command: >
      sh -c 'while true; do
        wget -qO- "http://app:3000/api/cron/tick?key=$$CRON_SECRET" || echo "tick failed";
        sleep $$CRON_INTERVAL_SECONDS;
      done'

volumes:
  db-data:
